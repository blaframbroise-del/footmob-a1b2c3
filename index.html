<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--mut:#5b6784;--line:#dfe5f1;--acc:#1f4fd8;--ok:#1a8f4b;--warn:#b7791f;--bad:#c53030}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:0 16px 90px}
header{padding:16px 0 8px}h1{font-size:20px;margin:0}small,.mut{color:var(--mut)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.bar .full{grid-column:1/-1}
select,input[type=search],button{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.pick{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pick b{display:block}.prob{font-weight:700;font-size:18px;text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.JOUABLE{color:var(--ok)}.PRUDENCE,.MANUEL{color:var(--warn)}.ÉVITER{color:var(--bad)}
.match{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:12px}
.match p{margin:6px 0}details summary{cursor:pointer;font-weight:600}
nav{display:flex;gap:6px;margin:10px 0}nav button{flex:1}nav button.on{background:var(--acc);color:#fff}
#fiche{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
#fiche button{width:auto;padding:10px 14px}
.hide{display:none}

const $=s=>document.querySelector(s);
const pct=x=>(x*100).toFixed(1)+" %";
const key=p=>[p.match,p.market,p.scope,p.direction,p.line].join("|");
let fiche=[];try{fiche=JSON.parse(localStorage.getItem("fiche_"+D.date)||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("fiche_"+D.date,JSON.stringify(fiche))}catch(e){}};
$("#d").textContent=D.date;$("#g").textContent="Généré le "+D.generated+" · "+D.matches.length+" matchs";
const uniq=a=>[...new Set(a)].sort();
const fill=(id,vals)=>vals.forEach(v=>{const o=document.createElement("option");o.textContent=v;$(id).appendChild(o)});
fill("#fc",uniq(D.picks.map(p=>p.competition)));fill("#fm",uniq(D.picks.map(p=>p.market)));fill("#fs",uniq(D.picks.map(p=>p.scope)));
function label(p){return p.market+" · "+p.scope+" · "+p.direction+(p.line!=null&&p.line!==""?" "+p.line:"")}
function renderPicks(){
 const q=$("#q").value.toLowerCase(),c=$("#fc").value,m=$("#fm").value,d=$("#fd").value,s=$("#fs").value,mp=parseFloat($("#fp").value),ha=$("#hideAvoid").checked;
 let r=D.picks.filter(p=>p.prob>=mp&&(!c||p.competition===c)&&(!m||p.market===m)&&(!d||p.decision===d)&&(!s||p.scope===s)&&(!ha||p.decision!=="ÉVITER")&&(!q||(p.home+" "+p.away+" "+p.competition).toLowerCase().includes(q)));
 const so=$("#so").value;r.sort((a,b)=>so==="trap"?a.trap-b.trap||b.prob-a.prob:so==="time"?a.time.localeCompare(b.time):b.prob-a.prob);
 $("#picks").innerHTML=r.length?"":'<p class="mut">Aucun choix avec ces filtres.</p>';
 r.forEach(p=>{const el=document.createElement("div");el.className="pick";const on=fiche.some(f=>key(f)===key(p));
  el.innerHTML='<input type="checkbox" '+(on?"checked":"")+'><div><b>'+p.home+' — '+p.away+'</b><span class="mut">'+p.time+' · '+p.competition+'</span><br>'+label(p)+' <span class="tag '+p.decision+'">'+p.decision+'</span> <span class="mut">Trap '+p.trap+'</span></div><div class="prob">'+pct(p.prob)+'</div>';
  el.querySelector("input").onchange=e=>{if(e.target.checked)fiche.push(p);else fiche=fiche.filter(f=>key(f)!==key(p));save();count();renderFiche()};
  $("#picks").appendChild(el)});
}
function renderMatches(){
 $("#matches").innerHTML="";
 D.matches.forEach(m=>{const el=document.createElement("div");el.className="match";
  const top=D.picks.filter(p=>p.match===m.id&&p.decision!=="ÉVITER").slice(0,3).map(p=>label(p)+" — "+pct(p.prob)).join("<br>")||"Aucun choix retenu";
  el.innerHTML='<b>'+m.home+' — '+m.away+'</b><br><span class="mut">'+m.time+' · '+m.competition+' · Trap Score '+m.trap+'</span>'
   +'<p><b>Meilleurs choix</b><br>'+top+'</p>'
   +(m.narrative.length?'<details><summary>Enjeu et lecture du match</summary>'+m.enjeu.map(e=>'<p>'+e+'</p>').join("")+m.narrative.map(n=>'<p><b>'+n[0]+'</b> — '+n[1]+'</p>').join("")+'</details>':'')
   +(m.blacklist.length?'<p class="mut">Marchés blacklistés : '+m.blacklist.join(", ")+'</p>':'');
  $("#matches").appendChild(el)});
}
function ficheText(){return "Fiche du "+D.date+"\n"+fiche.map((p,i)=>(i+1)+". "+p.home+" - "+p.away+" ("+p.time+") : "+label(p)+" ["+pct(p.prob)+"]").join("\n")}
function renderFiche(){
 $("#fl").innerHTML=fiche.length?"":'<p class="mut">Votre fiche est vide : cochez des choix dans « Meilleurs choix ».</p>';
 fiche.forEach(p=>{const el=document.createElement("div");el.className="pick";el.innerHTML='<span></span><div><b>'+p.home+' — '+p.away+'</b>'+label(p)+'</div><div class="prob">'+pct(p.prob)+'</div>';$("#fl").appendChild(el)});
}
function count(){$("#cnt").textContent="Fiche : "+fiche.length+" choix"}
const copy=async()=>{const t=ficheText();try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}};
$("#copy").onclick=async()=>{await copy();alert("Fiche copiée")};
$("#open").onclick=async()=>{await copy();location.href=D.bet365};
$("#clear").onclick=()=>{fiche=[];save();count();renderFiche();renderPicks()};
function tab(n){["1","2","3"].forEach(i=>{$("#v"+i).classList.toggle("hide",i!==n);$("#t"+i).classList.toggle("on",i===n)})}
$("#t1").onclick=()=>tab("1");$("#t2").onclick=()=>tab("2");$("#t3").onclick=()=>{renderFiche();tab("3")};$("#go").onclick=()=>{renderFiche();tab("3")};
["q","fc","fm","fd","fs","fp","so","hideAvoid"].forEach(i=>$("#"+i).addEventListener("input",renderPicks));
renderPicks();renderMatches();renderFiche();count();
